[server]
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
# Dark theme matching the app.py premium CSS
base = "dark"
primaryColor      = "#38bdf8"
backgroundColor   = "#050d1a"
secondaryBackgroundColor = "#0a1628"
textColor         = "#e2e8f0"
font = "sans serif"
